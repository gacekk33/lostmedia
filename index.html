
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST MEDIA</title>

<script>
/* =================================
   USTAWIENIA STRONY
   ON = strona wyłączona
   OFF = strona działa normalnie
================================= */

const SITE_STATUS = "OFF";

/* =================================
   INFO - DODAWANIE WPISÓW
   Każdy tekst w cudzysłowie to osobna informacja
================================= */

const INFO_ITEMS = [
    "jak kupisz to masz:",
    "20 utwórów",
    "limitowane opakowanie preorderowe.",
    "płyta dostępa *tylko* w preorderze.",
    "możliwość wcześniejszego posłuchania płyty.",
    "data premiery na yt.",
    "preorder limitowany na 3333 sztuk."
];

</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

/* EKRAN OFFLINE */

.maintenance {
    position: fixed;
    inset: 0;
    background: #080808;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
}

.maintenance.active {
    display: flex;
}

/* BANER */

.banner {
    width: 100%;
    margin-top: 20px;
    padding: 0 20px;
}

.banner img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 300px;
    object-fit: cover;
}

/* GŁOSÓWKI */

.voice-notes {
    position: absolute;
    top: 360px;
    left: 25px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 5;
}

.voice-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.voice-label {
    font-size: 13px;
    font-weight: normal;
    color: #bdbdbd;
    letter-spacing: 0.5px;
}

.voice-note {
    width: 270px;
    height: 65px;
    background: #202020;
    border: 1px solid #383838;
    border-radius: 15px;
    display: flex;
    align-items: center;
    padding: 10px 13px;
    gap: 12px;
}

.play-btn {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border: none;
    border-radius: 50%;
    background: #eeeeee;
    color: #111;
    cursor: pointer;
    font-size: 15px;
}

.play-btn:hover {
    background: #cccccc;
}

.voice-content {
    flex: 1;
    min-width: 0;
}

.waveform {
    height: 27px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    overflow: hidden;
}

.waveform span {
    width: 3px;
    min-width: 2px;
    background: #aaa;
    border-radius: 5px;
    height: var(--bar-height);
}

.waveform.playing span {
    animation: wave 0.7s ease-in-out infinite alternate;
}

.waveform.playing span:nth-child(2n) {
    animation-delay: 0.2s;
}

.waveform.playing span:nth-child(3n) {
    animation-delay: 0.4s;
}

@keyframes wave {
    from { transform: scaleY(0.5); }
    to { transform: scaleY(1.2); }
}

.voice-time {
    color: #999;
    font-size: 10px;
    display: block;
    margin-top: 3px;
}

/* NAPIS POD GŁOSÓWKAMI */

.voice-footer {
    color: #bdbdbd;
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 0.5px;
    margin-top: 0;
}

/* INFO */

.info {
    position: absolute;
    top: 360px;
    right: 25px;
    width: 270px;
}

.info h1 {
    font-size: 25px;
    font-weight: normal;
    text-transform: lowercase;
    letter-spacing: 2px;
    margin-bottom: 35px;
    text-align: center;
}

.info-item {
    color: #bdbdbd;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 18px;
    text-align: left;
}

/* PRODUKT */

.main {
    min-height: 65vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

h1 {
    font-size: 25px;
    font-weight: normal;
    text-transform: lowercase;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

.product {
    width: 300px;
    max-width: 80vw;
    cursor: pointer;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

/* ZAMÓWIENIE */

.ordered {
    display: none;
    position: fixed;
    inset: 0;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: #080808;
    text-align: center;
    animation: appear 1s ease;
    z-index: 20;
}

.ordered h2 {
    font-size: 30px;
    letter-spacing: 3px;
    font-weight: normal;
    margin-bottom: 15px;
}

.ordered p {
    color: #999;
    font-size: 15px;
    letter-spacing: 1px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* TELEFONY */

@media (max-width: 600px) {
    .voice-notes {
        position: relative;
        top: auto;
        left: auto;
        margin: 20px;
    }

    .voice-note {
        width: min(270px, calc(100vw - 40px));
    }

    .info {
        position: relative;
        top: auto;
        right: auto;
        width: auto;
        margin: 35px 20px;
    }

    .info h1 {
        text-align: left;
    }

    .main {
        min-height: 50vh;
    }
}
</style>
</head>

<body>

<!-- EKRAN OFFLINE -->

<div class="maintenance" id="maintenance">
    wróć o 22:22
</div>


<!-- BANER -->

<div class="banner" id="banner">
    <img src="banerlost.png" alt="Lost Media Banner">
</div>


<!-- GŁOSÓWKI -->

<div class="voice-notes" id="voiceNotes">

    <div class="voice-group">

        <div class="voice-label">
            red alabaster full
        </div>

        <div class="voice-note">

            <button class="play-btn" onclick="toggleVoice(0)">
                ▶
            </button>

            <div class="voice-content">
                <div class="waveform" id="wave0"></div>
                <span class="voice-time" id="time0">00:00</span>
            </div>

            <audio id="audio0" src="redalabaster.mp3" preload="metadata"></audio>

        </div>
    </div>


    <div class="voice-group">

        <div class="voice-label">
            za każdym ra2em snippet
        </div>

        <div class="voice-note">

            <button class="play-btn" onclick="toggleVoice(1)">
                ▶
            </button>

            <div class="voice-content">
                <div class="waveform" id="wave1"></div>
                <span class="voice-time" id="time1">00:00</span>
            </div>

            <audio id="audio1" src="snippet1.mp3" preload="metadata"></audio>

        </div>
    </div>


    <!-- NAPIS POD OSTATNIĄ GŁOSÓWKĄ -->

    <div class="voice-footer" id="voiceFooter">
        premiera na yt wkroo#c3ee.
    </div>

</div>


<!-- INFO -->

<div class="info" id="info">

    <h1>info</h1>

    <div id="infoList"></div>

</div>


<!-- PRODUKT -->

<div class="main" id="main">

    <div>
        <h1>kup płyte lost media</h1>

        <img
            src="lostmedia.jpg"
            class="product"
            alt="Lost Media"
            onclick="order()"
        >
    </div>

</div>


<!-- ZAMÓWIENIE -->

<div class="ordered" id="ordered">

    <h2>dostępne 19.11.26</h2>

    <p>19.11 za każdym ra2em full</p>

</div>


<script>

/* USTAWIENIE TRYBU STRONY */

if (SITE_STATUS === "ON") {
    document.getElementById("maintenance").classList.add("active");
}


/* WYŚWIETLANIE INFO */

const infoList = document.getElementById("infoList");

INFO_ITEMS.forEach(text => {

    const item = document.createElement("div");

    item.className = "info-item";
    item.textContent = text;

    infoList.appendChild(item);

});


/* GŁOSÓWKI */

const audios = [
    document.getElementById("audio0"),
    document.getElementById("audio1")
];


/* TWORZENIE FALI */

function createWave(id) {

    const wave = document.getElementById("wave" + id);

    for (let i = 0; i < 38; i++) {

        const bar = document.createElement("span");
        const height = 5 + Math.random() * 19;

        bar.style.setProperty(
            "--bar-height",
            height + "px"
        );

        wave.appendChild(bar);
    }
}

createWave(0);
createWave(1);


/* RESET */

function resetVoice(id) {

    const audio = audios[id];

    audio.pause();
    audio.currentTime = 0;

    document.querySelectorAll(".play-btn")[id].textContent = "▶";

    document.getElementById("wave" + id)
        .classList.remove("playing");

    document.getElementById("time" + id)
        .textContent = "00:00";
}


/* ODTWARZANIE */

function toggleVoice(id) {

    const audio = audios[id];

    if (!audio.paused) {
        resetVoice(id);
        return;
    }

    audios.forEach((other, i) => {
        resetVoice(i);
    });

    audio.currentTime = 0;

    audio.play().then(() => {

        document.querySelectorAll(".play-btn")[id]
            .textContent = "Ⅱ";

        document.getElementById("wave" + id)
            .classList.add("playing");

    }).catch(error => {

        console.log("Błąd odtwarzania:", error);

    });
}


/* CZAS NAGRANIA */

audios.forEach((audio, id) => {

    audio.addEventListener("timeupdate", () => {

        const minutes = Math.floor(audio.currentTime / 60);
        const seconds = Math.floor(audio.currentTime % 60);

        document.getElementById("time" + id).textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

    });

    audio.addEventListener("ended", () => {
        resetVoice(id);
    });

});


/* ZAMÓWIENIE */

function order() {

    audios.forEach((audio, id) => {
        resetVoice(id);
    });

    document.getElementById("main").style.display = "none";
    document.getElementById("banner").style.display = "none";
    document.getElementById("voiceNotes").style.display = "none";
    document.getElementById("info").style.display = "none";
    document.getElementById("ordered").style.display = "flex";

}

</script>

</body>
</html>
