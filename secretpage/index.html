<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>LOST MEDIA — SECRET PAGE</title>
  <style>
    :root { color-scheme: dark; --bg:#050505; --panel:#0c0c0c; --line:#242424; --muted:#777; --white:#e9e9e9; --red:#a51d28; }
    * { box-sizing:border-box; }
    html { background:var(--bg); scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--white); background:radial-gradient(ellipse at 50% -15%, #202020 0%, #090909 42%, #030303 100%); font-family:Arial,Helvetica,sans-serif; }
    body:after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.12; z-index:5; background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(255,255,255,.035) 4px, transparent 5px); }
    .wrap { width:min(1120px, calc(100% - 36px)); margin:auto; padding:38px 0 70px; }
    header { border-bottom:1px solid var(--line); padding:0 0 24px; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; }
    .brand { font-size:12px; letter-spacing:5px; color:#aaa; }
    .brand strong { display:block; color:#f2f2f2; font-size:clamp(27px,5vw,43px); letter-spacing:7px; margin-top:9px; font-weight:800; }
    .status { font:10px/1.5 monospace; letter-spacing:2px; color:#a8a8a8; text-align:right; }
    .status span { color:#c83b46; }
    .intro { padding:38px 0 30px; }
    .eyebrow { color:#9d3038; font:11px monospace; letter-spacing:3px; }
    h1 { margin:12px 0 8px; font-size:clamp(28px,5vw,48px); letter-spacing:2px; font-weight:800; }
    .sub { margin:0; color:#777; font:12px monospace; letter-spacing:1px; }
    .section-head { display:flex; align-items:center; gap:14px; margin:32px 0 16px; }
    .section-head h2 { margin:0; font-size:13px; letter-spacing:3px; white-space:nowrap; }
    .section-head:after { content:""; height:1px; background:var(--line); flex:1; }
    .gallery { display:grid; grid-template-columns:repeat( auto-fit, minmax(220px, 1fr)); gap:13px; }
    .photo { position:relative; display:block; padding:0; border:1px solid #252525; background:#090909; overflow:hidden; cursor:zoom-in; aspect-ratio:4/3; text-align:left; }
    .photo img { width:100%; height:100%; display:block; object-fit:cover; filter:saturate(.78) contrast(1.06); opacity:.86; transition:transform .45s, opacity .3s, filter .3s; }
    .photo:hover img { transform:scale(1.035); opacity:1; filter:saturate(1) contrast(1.08); }
    .photo:after { content:""; position:absolute; inset:45% 0 0; background:linear-gradient(transparent,rgba(0,0,0,.8)); pointer-events:none; }
    .photo span { position:absolute; z-index:1; bottom:12px; left:13px; color:#ddd; font:10px monospace; letter-spacing:2px; }
    .audio-list { display:grid; gap:10px; }
    .audio-item { border:1px solid var(--line); background:linear-gradient(110deg,#101010,#080808); padding:15px 17px; display:grid; grid-template-columns: minmax(95px,150px) 1fr; gap:15px; align-items:center; }
    .audio-name { font:11px monospace; letter-spacing:2px; color:#bbb; }
    .audio-name small { display:block; color:#555; margin-top:6px; font-size:9px; letter-spacing:1px; }
    audio { width:100%; height:34px; filter:grayscale(1); }
    footer { border-top:1px solid var(--line); margin-top:48px; padding-top:17px; color:#505050; display:flex; justify-content:space-between; gap:15px; font:9px monospace; letter-spacing:2px; }
    .viewer { display:none; position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.94); align-items:center; justify-content:center; padding:25px; cursor:zoom-out; }
    .viewer.open { display:flex; }
    .viewer img { max-width:min(1100px,100%); max-height:88vh; object-fit:contain; box-shadow:0 0 70px #000; }
    .close { position:absolute; top:18px; right:22px; color:#eee; font:24px Arial; cursor:pointer; }
    @media(max-width:600px) { .wrap{width:calc(100% - 24px);padding-top:25px}.status{font-size:8px}.audio-item{grid-template-columns:1fr;gap:9px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photo{aspect-ratio:1/1}.section-head{margin-top:27px} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">LOST MEDIA<strong>SECRET PAGE</strong></div>
      <div class="status">PRIVATE DIRECTORY<br><span>●</span> CONNECTION UNKNOWN</div>
    </header>

    <section class="intro">
      <div class="eyebrow">// UNLISTED CONTENT</div>
      <h1>NO RECORD FOUND.</h1>
      <p class="sub">some files may be damaged or incomplete</p>
    </section>

    <div class="section-head"><h2>IMAGE FILES</h2></div>
    <section class="gallery" aria-label="Galeria zdjęć">
      <button class="photo" data-image="../secret1.png" aria-label="Otwórz secret1.png"><img src="../secret1.png" alt="Secret image 01"><span>IMG_001 // SECRET1.PNG</span></button>
      <button class="photo" data-image="../secret2.png" aria-label="Otwórz secret2.png"><img src="../secret2.png" alt="Secret image 02"><span>IMG_002 // SECRET2.PNG</span></button>
      <button class="photo" data-image="../secret3.png" aria-label="Otwórz secret3.png"><img src="../secret3.png" alt="Secret image 03"><span>IMG_003 // SECRET3.PNG</span></button>
      <button class="photo" data-image="../secret4.png" aria-label="Otwórz secret4.png"><img src="../secret4.png" alt="Secret image 04"><span>IMG_004 // SECRET4.PNG</span></button>
      <button class="photo" data-image="../secret5.png" aria-label="Otwórz secret5.png"><img src="../secret5.png" alt="Secret image 05"><span>IMG_005 // SECRET5.PNG</span></button>
    </section>

    <div class="section-head"><h2>AUDIO RECORDINGS</h2></div>
    <section class="audio-list" aria-label="Nagrania audio">
      <div class="audio-item"><div class="audio-name">0101.MP3<small>AUDIO FILE // 001</small></div><audio controls preload="none"><source src="../0101.mp3" type="audio/mpeg">Twoja przeglądarka nie obsługuje audio.</audio></div>
      <div class="audio-item"><div class="audio-name">0102.MP3<small>AUDIO FILE // 002</small></div><audio controls preload="none"><source src="../0102.mp3" type="audio/mpeg">Twoja przeglądarka nie obsługuje audio.</audio></div>
      <div class="audio-item"><div class="audio-name">SNIPPETT.MP3<small>AUDIO FILE // 003</small></div><audio controls preload="none"><source src="../snippett.mp3" type="audio/mpeg">Twoja przeglądarka nie obsługuje audio.</audio></div>
    </section>

    <footer><span>LOST MEDIA © 2026</span><span>DIRECTORY // 000</span></footer>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia">
    <span class="close" aria-label="Zamknij">×</span>
    <img id="viewerImage" src="" alt="Powiększone zdjęcie">
  </div>
  <script>
    const viewer = document.getElementById('viewer');
    const viewerImage = document.getElementById('viewerImage');
    document.querySelectorAll('.photo').forEach(button => {
      button.addEventListener('click', () => {
        viewerImage.src = button.dataset.image;
        viewer.classList.add('open');
      });
    });
    viewer.addEventListener('click', () => {
      viewer.classList.remove('open');
      viewerImage.src = '';
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        viewer.classList.remove('open');
        viewerImage.src = '';
      }
    });
  </script>
</body>
</html>
